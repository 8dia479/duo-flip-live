name: Flip preview build
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubDebug
      - uses: actions/upload-artifact@v4
        with:
          name: flip-preview-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
