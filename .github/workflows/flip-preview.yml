name: Flip preview build
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and test
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --max-workers=1 --console=plain -Dorg.gradle.jvmargs='-Xmx1536m -Dfile.encoding=UTF-8' testGithubDebugUnitTest > build-output.txt 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            ./gradlew --no-daemon --max-workers=1 --console=plain -Dorg.gradle.jvmargs='-Xmx1536m -Dfile.encoding=UTF-8' assembleGithubDebug >> build-output.txt 2>&1
            code=$?
          fi
          cat build-output.txt
          if [ "$code" -ne 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('build-output.txt').read_text(errors='replace').splitlines()
          relevant = [line for line in lines if any(s in line for s in (' e: ', 'e: ', 'error:', 'What went wrong', 'Could not', 'failed', 'FAILURE:', 'Execution failed', 'Exception', 'not found'))]
          for line in relevant[-20:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
          exit "$code"
      - name: Verify and package debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          cp app/build/outputs/apk/github/debug/app-github-debug.apk deliverables/duo-flip-preview-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs deliverables/duo-flip-preview-debug.apk | tee deliverables/signature.txt
          "$tools/aapt" dump badging deliverables/duo-flip-preview-debug.apk > deliverables/package-info.txt
          unzip -l deliverables/duo-flip-preview-debug.apk > deliverables/apk-contents.txt
          grep -q 'classes.dex' deliverables/apk-contents.txt
          grep -q 'resources.arsc' deliverables/apk-contents.txt
          (cd deliverables && sha256sum duo-flip-preview-debug.apk > SHA256SUMS.txt)
          echo "::notice::$(cat deliverables/SHA256SUMS.txt)"
          echo "::notice::$(grep -E '^package:|^sdkVersion:|^targetSdkVersion:' deliverables/package-info.txt | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: flip-preview-debug-apk
          path: deliverables/
          if-no-files-found: error
