name: Android debug APK

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Build and package debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Run project motion checks
        run: |
          python3 tools/check_inner_stretch.py
          python3 tools/check_window_shading.py
          python3 tools/check_motion_projection.py

      - name: Run tests and assemble debug APK
        run: ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubDebug

      - name: Verify debug APK and generate checksum
        run: |
          apk="app/build/outputs/apk/github/debug/app-github-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > app-github-debug.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: duo-fold-live-debug-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/github/debug/app-github-debug.apk
            app-github-debug.sha256
          if-no-files-found: error
          retention-days: 14
