name: Duo Flip debug APK

on:
  push:
    branches:
      - feature/flip6-live-transitions
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Build Duo Flip feature branch debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out Duo Flip feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/flip6-live-transitions
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Run Flip and motion checks
        run: |
          python3 tools/check_inner_stretch.py
          python3 tools/check_window_shading.py
          python3 tools/check_motion_projection.py
          python3 -m unittest discover -s tools/tests

      - name: Run unit tests and assemble GitHub debug APK
        run: ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubDebug

      - name: Verify APK and create checksum
        run: |
          apk="app/build/outputs/apk/github/debug/app-github-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > duo-flip-debug.sha256

      - name: Upload Duo Flip debug APK
        uses: actions/upload-artifact@v4
        with:
          name: duo-flip-feature-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/github/debug/app-github-debug.apk
            duo-flip-debug.sha256
          if-no-files-found: error
          retention-days: 14
